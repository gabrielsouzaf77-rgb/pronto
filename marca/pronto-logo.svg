    <path d="M126.5 56.25V23.75M126.5 56.25V40A16.25 16.25 0 0 1 159 40V56.25"/>
    <!-- t -->
    <path d="M181.5 8V46A10.25 10.25 0 0 0 191.75 56.25H195M173.5 23.75H195"/>
